# Workflow GitHub Actions : exécute le scraping automatiquement, gratuitement,
# sur les serveurs de GitHub — pas besoin que ton PC soit allumé.
#
# INSTALLATION :
# 1. Crée un dépôt GitHub (PRIVÉ de préférence, pour ne pas exposer tes données)
# 2. Mets-y à la racine : scrape_wellness_gmaps.py, villes.csv
# 3. Crée le dossier .github/workflows/ à la racine du dépôt
# 4. Place ce fichier dedans, sous le nom : .github/workflows/scrape.yml
# 5. Onglet "Actions" du dépôt GitHub > autorise les workflows si demandé
# 6. Onglet "Actions" > "Extraction wellness Google Maps" > "Run workflow"
#    pour un premier lancement manuel, ou attends le prochain horaire planifié
#
# FONCTIONNEMENT :
# - Le script tourne sur une machine temporaire de GitHub (jusqu'à 6h par run,
#   largement suffisant pour traiter un lot de villes)
# - À la fin (ou si le temps imparti au run est écoulé), le résultat
#   (resultats.csv) et la progression (villes.csv mis à jour avec "statut")
#   sont automatiquement commités et poussés dans ton dépôt
# - Au prochain déclenchement planifié, le script reprend exactement où il
#   s'était arrêté (grâce à la colonne "statut" déjà en place)
# - Gratuit : les dépôts publics ont des minutes illimitées ; les dépôts
#   privés ont 2000 minutes gratuites par mois (largement suffisant ici)

name: Extraction wellness Google Maps

on:
  schedule:
    - cron: "0 3 * * *"   # tous les jours à 3h UTC — ajuste à ta convenance
  workflow_dispatch: {}     # permet aussi un lancement manuel depuis l'onglet Actions

# Nécessaire pour que le workflow puisse pousser ses commits vers le dépôt
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 340   # s'arrête proprement avant la limite de 360 min (6h) de GitHub

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Lancer le script et sauvegarder en continu
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config pull.rebase true

          # lance le script en tâche de fond
          python -u scrape_wellness_gmaps.py &
          SCRIPT_PID=$!

          # pendant que le script tourne, on commit/push toutes les 2 minutes
          while kill -0 $SCRIPT_PID 2>/dev/null; do
            sleep 120
            git add resultats.csv statut_maps.csv
            if ! git diff --quiet --cached; then
              git commit -m "Progression $(date -u +'%Y-%m-%d %H:%M UTC')"
              git pull --rebase || true   # évite les conflits si un autre push a eu lieu entre-temps
              git push
              echo "[i] Progression poussée vers GitHub."
            fi
          done

          # attend la fin réelle du script et récupère son code de sortie
          wait $SCRIPT_PID
          EXIT_CODE=$?

          # commit final, au cas où il resterait des données non poussées
          git add resultats.csv statut_maps.csv
          if ! git diff --quiet --cached; then
            git commit -m "Résultat final $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase || true
            git push
          fi

          exit $EXIT_CODE
